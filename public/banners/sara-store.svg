<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none" role="img" aria-label="A SARA electronics store">
  <defs>
    <linearGradient id="sf-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B4F93"/>
      <stop offset="100%" stop-color="#0D2B54"/>
    </linearGradient>
    <linearGradient id="sf-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE6BE" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#FFB86B" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sf-fascia" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#123E7E"/>
      <stop offset="55%" stop-color="#1A5AB0"/>
      <stop offset="100%" stop-color="#0E3468"/>
    </linearGradient>
    <linearGradient id="sf-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E9AA8"/>
      <stop offset="100%" stop-color="#5E6874"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#sf-sky)"/>

  <!-- Building mass -->
  <rect x="28" y="40" width="584" height="330" rx="6" fill="#0F3468"/>

  <!-- Upper fascia with signage -->
  <rect x="28" y="40" width="584" height="96" fill="url(#sf-fascia)"/>
  <text x="86" y="98" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="52" font-weight="700" letter-spacing="3">SARA</text>
  <rect x="88" y="108" width="118" height="5" rx="2.5" fill="#E11D2E"/>
  <text x="212" y="100" fill="#DCE7F5" font-family="Inter, sans-serif" font-size="15" letter-spacing="1">Mobiles | Electronics | More</text>

  <!-- Vertical fin sign -->
  <rect x="536" y="52" width="56" height="212" rx="5" fill="#0B2A55"/>
  <text x="564" y="128" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="26" font-weight="700" text-anchor="middle">S</text>
  <text x="564" y="164" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="26" font-weight="700" text-anchor="middle">A</text>
  <text x="564" y="200" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="26" font-weight="700" text-anchor="middle">R</text>
  <text x="564" y="236" fill="#FFFFFF" font-family="Poppins, sans-serif" font-size="26" font-weight="700" text-anchor="middle">A</text>

  <!-- Glazed shopfront -->
  <g>
    <rect x="48" y="150" width="472" height="196" rx="4" fill="url(#sf-glass)"/>
    <g fill="#0B2A55" opacity="0.22">
      <rect x="48" y="150" width="6" height="196"/>
      <rect x="166" y="150" width="6" height="196"/>
      <rect x="284" y="150" width="6" height="196"/>
      <rect x="402" y="150" width="6" height="196"/>
      <rect x="514" y="150" width="6" height="196"/>
      <rect x="48" y="212" width="472" height="5"/>
    </g>

    <!-- Interior silhouettes: shelving and displays -->
    <g fill="#0B2A55" opacity="0.5">
      <rect x="70" y="238" width="74" height="48" rx="3"/>
      <rect x="190" y="228" width="74" height="58" rx="3"/>
      <rect x="308" y="244" width="74" height="42" rx="3"/>
      <rect x="424" y="232" width="74" height="54" rx="3"/>
      <rect x="70" y="296" width="428" height="6" rx="3"/>
    </g>
    <g fill="#0B2A55" opacity="0.35">
      <circle cx="118" cy="318" r="12"/>
      <circle cx="150" cy="320" r="9"/>
      <circle cx="262" cy="318" r="12"/>
      <circle cx="352" cy="320" r="10"/>
      <circle cx="452" cy="318" r="12"/>
    </g>
  </g>

  <!-- Entrance -->
  <rect x="272" y="252" width="96" height="94" rx="3" fill="#08213F" opacity="0.55"/>

  <!-- Forecourt -->
  <rect y="346" width="640" height="74" fill="url(#sf-floor)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2">
    <path d="M0 370h640M0 394h640"/>
  </g>
</svg>
