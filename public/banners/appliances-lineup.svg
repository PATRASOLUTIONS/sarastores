<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" fill="none" role="img" aria-label="Television, refrigerator, washing machine, air conditioner and audio products">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123E6B"/>
      <stop offset="45%" stop-color="#2D7FB8"/>
      <stop offset="100%" stop-color="#0B2C4D"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D3D9E0"/>
      <stop offset="35%" stop-color="#F2F5F8"/>
      <stop offset="100%" stop-color="#AEB7C2"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9AA4B1"/>
      <stop offset="40%" stop-color="#C8D0D9"/>
      <stop offset="100%" stop-color="#7D8794"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#B3143C"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Refrigerator -->
  <g>
    <rect x="470" y="46" width="132" height="270" rx="12" fill="url(#steel)"/>
    <rect x="470" y="46" width="132" height="104" rx="12" fill="url(#steelDark)" opacity="0.45"/>
    <rect x="478" y="152" width="116" height="2.5" fill="#8C96A3" opacity="0.7"/>
    <rect x="572" y="76" width="7" height="56" rx="3.5" fill="#6E7884"/>
    <rect x="572" y="176" width="7" height="76" rx="3.5" fill="#6E7884"/>
  </g>

  <!-- Air conditioner -->
  <g>
    <rect x="640" y="58" width="210" height="70" rx="16" fill="#FFFFFF"/>
    <rect x="640" y="104" width="210" height="24" rx="10" fill="#E7ECF1"/>
    <rect x="662" y="112" width="166" height="5" rx="2.5" fill="#C3CBD4"/>
    <circle cx="826" cy="78" r="4" fill="#3FA9F5"/>
  </g>

  <!-- Television -->
  <g>
    <rect x="40" y="96" width="330" height="196" rx="8" fill="#14181E"/>
    <rect x="48" y="104" width="314" height="172" rx="4" fill="url(#screen)"/>
    <path d="M48 238l74-62 52 44 46-38 72 58 70-40v16a4 4 0 0 1-4 4H52a4 4 0 0 1-4-4z" fill="#0A1E33" opacity="0.55"/>
    <circle cx="112" cy="140" r="16" fill="#FFFFFF" opacity="0.35"/>
    <rect x="186" y="292" width="38" height="34" fill="#2B313A"/>
    <rect x="126" y="324" width="158" height="12" rx="6" fill="#1B2029"/>
  </g>

  <!-- Washing machine -->
  <g>
    <rect x="356" y="176" width="146" height="150" rx="12" fill="url(#steel)"/>
    <rect x="356" y="176" width="146" height="30" rx="12" fill="#E3E8ED"/>
    <circle cx="429" cy="262" r="48" fill="#8E99A6"/>
    <circle cx="429" cy="262" r="39" fill="#1E2833"/>
    <circle cx="429" cy="262" r="30" fill="#3B5875" opacity="0.8"/>
    <circle cx="470" cy="192" r="5" fill="#3FA9F5"/>
  </g>

  <!-- Microwave -->
  <g>
    <rect x="214" y="266" width="132" height="62" rx="8" fill="#1B2029"/>
    <rect x="222" y="274" width="84" height="46" rx="4" fill="#39434F"/>
    <rect x="314" y="274" width="24" height="10" rx="2" fill="#C0392B"/>
    <rect x="314" y="290" width="24" height="5" rx="2" fill="#4B5563"/>
    <rect x="314" y="300" width="24" height="5" rx="2" fill="#4B5563"/>
  </g>

  <!-- Monitor / gaming display -->
  <g>
    <rect x="620" y="192" width="178" height="110" rx="7" fill="#14181E"/>
    <rect x="627" y="199" width="164" height="90" rx="3" fill="url(#glow)"/>
    <path d="M627 275l40-30 34 24 32-22 58 38v2a2 2 0 0 1-2 2H629a2 2 0 0 1-2-2z" fill="#3B0A17" opacity="0.5"/>
    <rect x="694" y="302" width="30" height="20" fill="#2B313A"/>
    <rect x="660" y="320" width="98" height="10" rx="5" fill="#1B2029"/>
  </g>

  <!-- Soundbar + speaker -->
  <g>
    <rect x="512" y="300" width="96" height="26" rx="8" fill="#1B2029"/>
    <circle cx="536" cy="313" r="7" fill="#39434F"/>
    <circle cx="560" cy="313" r="7" fill="#39434F"/>
    <circle cx="584" cy="313" r="7" fill="#39434F"/>
    <rect x="816" y="238" width="60" height="88" rx="8" fill="#1B2029"/>
    <circle cx="846" cy="266" r="15" fill="#39434F"/>
    <circle cx="846" cy="302" r="9" fill="#39434F"/>
  </g>

  <ellipse cx="450" cy="344" rx="420" ry="20" fill="url(#shadow)"/>
</svg>
