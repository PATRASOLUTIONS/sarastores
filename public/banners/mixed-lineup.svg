<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" fill="none" role="img" aria-label="Smartphone, laptop, television, refrigerator and audio products">
  <defs>
    <linearGradient id="ml-phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E5BD6"/>
      <stop offset="100%" stop-color="#3A1E6B"/>
    </linearGradient>
    <linearGradient id="ml-tv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21A0F0"/>
      <stop offset="50%" stop-color="#7A3BD1"/>
      <stop offset="100%" stop-color="#0F2557"/>
    </linearGradient>
    <linearGradient id="ml-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B9C2CC"/>
      <stop offset="40%" stop-color="#EDF1F5"/>
      <stop offset="100%" stop-color="#97A1AD"/>
    </linearGradient>
    <linearGradient id="ml-laptop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F80ED"/>
      <stop offset="100%" stop-color="#0B3C87"/>
    </linearGradient>
  </defs>

  <!-- Smartphones -->
  <g>
    <rect x="14" y="58" width="62" height="126" rx="12" fill="#1B2029"/>
    <rect x="19" y="63" width="52" height="116" rx="8" fill="url(#ml-phone)"/>
    <rect x="36" y="67" width="18" height="4" rx="2" fill="#1B2029"/>
    <circle cx="62" cy="80" r="7" fill="#11161D"/>
    <circle cx="62" cy="80" r="3" fill="#39434F"/>
  </g>
  <g>
    <rect x="66" y="74" width="56" height="114" rx="11" fill="#2B313A"/>
    <rect x="71" y="79" width="46" height="104" rx="7" fill="#0F2557"/>
  </g>

  <!-- Television -->
  <g>
    <rect x="150" y="44" width="166" height="104" rx="6" fill="#14181E"/>
    <rect x="156" y="50" width="154" height="92" rx="3" fill="url(#ml-tv)"/>
    <rect x="216" y="148" width="34" height="18" fill="#2B313A"/>
    <rect x="186" y="166" width="94" height="9" rx="4.5" fill="#1B2029"/>
  </g>

  <!-- Laptop -->
  <g>
    <rect x="146" y="176" width="132" height="42" rx="4" fill="#14181E"/>
    <rect x="151" y="181" width="122" height="32" rx="2" fill="url(#ml-laptop)"/>
    <path d="M134 218h156l10 12H124z" fill="#3A424D"/>
  </g>

  <!-- Refrigerator -->
  <g>
    <rect x="330" y="26" width="86" height="196" rx="9" fill="url(#ml-steel)"/>
    <rect x="330" y="26" width="86" height="74" rx="9" fill="#AAB4C0" opacity="0.45"/>
    <rect x="336" y="102" width="74" height="2.5" fill="#8C96A3"/>
    <rect x="396" y="48" width="5" height="36" rx="2.5" fill="#6E7884"/>
    <rect x="396" y="122" width="5" height="52" rx="2.5" fill="#6E7884"/>
  </g>

  <!-- Washing machine -->
  <g>
    <rect x="424" y="104" width="84" height="118" rx="9" fill="url(#ml-steel)"/>
    <rect x="424" y="104" width="84" height="22" rx="9" fill="#E3E8ED"/>
    <circle cx="466" cy="172" r="33" fill="#8E99A6"/>
    <circle cx="466" cy="172" r="26" fill="#1E2833"/>
    <circle cx="466" cy="172" r="18" fill="#3B5875" opacity="0.85"/>
  </g>

  <!-- Speaker + earbuds -->
  <g>
    <rect x="286" y="160" width="36" height="62" rx="7" fill="#1B2029"/>
    <circle cx="304" cy="180" r="10" fill="#39434F"/>
    <circle cx="304" cy="204" r="6" fill="#39434F"/>
    <circle cx="100" cy="204" r="15" fill="#1B2029"/>
    <circle cx="100" cy="204" r="7" fill="#39434F"/>
  </g>
</svg>
