<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" fill="none" role="img" aria-label="Television, refrigerator and washing machine">
  <defs>
    <linearGradient id="p-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F25C2A"/>
      <stop offset="55%" stop-color="#7A1FA2"/>
      <stop offset="100%" stop-color="#12204A"/>
    </linearGradient>
    <linearGradient id="p-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9D1DA"/>
      <stop offset="40%" stop-color="#F0F3F7"/>
      <stop offset="100%" stop-color="#A5AEBA"/>
    </linearGradient>
  </defs>

  <!-- Refrigerator -->
  <rect x="196" y="18" width="88" height="176" rx="9" fill="url(#p-steel)"/>
  <rect x="196" y="18" width="88" height="66" rx="9" fill="#B9C2CC" opacity="0.5"/>
  <rect x="202" y="86" width="76" height="2" fill="#8C96A3" opacity="0.7"/>
  <rect x="262" y="40" width="5" height="34" rx="2.5" fill="#6E7884"/>
  <rect x="262" y="106" width="5" height="46" rx="2.5" fill="#6E7884"/>

  <!-- Television -->
  <rect x="14" y="54" width="176" height="106" rx="6" fill="#14181E"/>
  <rect x="20" y="60" width="164" height="92" rx="3" fill="url(#p-screen)"/>
  <rect x="88" y="160" width="28" height="20" fill="#2B313A"/>
  <rect x="60" y="178" width="84" height="8" rx="4" fill="#1B2029"/>

  <!-- Washing machine -->
  <rect x="296" y="76" width="102" height="118" rx="10" fill="url(#p-steel)"/>
  <rect x="296" y="76" width="102" height="22" rx="10" fill="#E3E8ED"/>
  <circle cx="347" cy="146" r="36" fill="#8E99A6"/>
  <circle cx="347" cy="146" r="29" fill="#1E2833"/>
  <circle cx="347" cy="146" r="21" fill="#3B5875" opacity="0.8"/>

  <!-- Soundbar -->
  <rect x="34" y="186" width="120" height="16" rx="6" fill="#1B2029"/>
</svg>
