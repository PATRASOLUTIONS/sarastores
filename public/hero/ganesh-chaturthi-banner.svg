<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600" role="img" aria-label="Ganpati Bappa Morya — Ganesh Chaturthi offers at Sara Electronics">
  <title>Ganesh Chaturthi offers at Sara Electronics</title>

  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9C2A0E"/>
      <stop offset="52%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#6B1607"/>
    </linearGradient>

    <radialGradient id="gGlow" cx="74%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#F5A623" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#C77800"/>
    </linearGradient>

    <!-- Rangoli dot field, kept low-contrast so text stays readable. -->
    <pattern id="gRangoli" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="3" fill="#F5A623" opacity="0.30"/>
      <circle cx="42" cy="42" r="2" fill="#FFD54F" opacity="0.22"/>
      <circle cx="42" cy="14" r="1.5" fill="#FFFFFF" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1920" height="600" fill="url(#gBg)"/>
  <rect width="1920" height="600" fill="url(#gRangoli)"/>
  <rect width="1920" height="600" fill="url(#gGlow)"/>

  <!-- Marigold toran across the top -->
  <g>
    <path d="M0 0 H1920 V26 Q960 74 0 26 Z" fill="#7A200A" opacity="0.55"/>
    <g fill="url(#gGold)">
      <circle cx="40"   cy="40" r="13"/><circle cx="120"  cy="46" r="10"/>
      <circle cx="200"  cy="51" r="13"/><circle cx="280"  cy="55" r="10"/>
      <circle cx="360"  cy="59" r="13"/><circle cx="440"  cy="62" r="10"/>
      <circle cx="520"  cy="65" r="13"/><circle cx="600"  cy="67" r="10"/>
      <circle cx="680"  cy="69" r="13"/><circle cx="760"  cy="70" r="10"/>
      <circle cx="840"  cy="71" r="13"/><circle cx="920"  cy="72" r="10"/>
      <circle cx="1000" cy="72" r="13"/><circle cx="1080" cy="71" r="10"/>
      <circle cx="1160" cy="70" r="13"/><circle cx="1240" cy="69" r="10"/>
      <circle cx="1320" cy="67" r="13"/><circle cx="1400" cy="65" r="10"/>
      <circle cx="1480" cy="62" r="13"/><circle cx="1560" cy="59" r="10"/>
      <circle cx="1640" cy="55" r="13"/><circle cx="1720" cy="51" r="10"/>
      <circle cx="1800" cy="46" r="13"/><circle cx="1880" cy="40" r="10"/>
    </g>
  </g>

  <!-- Om medallion -->
  <g transform="translate(1470 300)">
    <circle r="196" fill="#6B1607" opacity="0.34"/>
    <circle r="168" fill="none" stroke="url(#gGold)" stroke-width="3" opacity="0.85"/>
    <circle r="150" fill="none" stroke="#FFD54F" stroke-width="1.5" stroke-dasharray="5 11" opacity="0.65"/>
    <text x="0" y="66" text-anchor="middle" font-family="Nirmala UI, Noto Sans Devanagari, Segoe UI, sans-serif"
          font-size="212" fill="url(#gGold)">ॐ</text>
    <text x="0" y="140" text-anchor="middle" font-family="Nirmala UI, Noto Sans Devanagari, Segoe UI, sans-serif"
          font-size="30" font-weight="700" fill="#FFE7B3" letter-spacing="2">गणपती बाप्पा मोरया</text>
  </g>

  <!-- Diyas along the base -->
  <g>
    <g transform="translate(1180 520)">
      <ellipse cx="0" cy="10" rx="30" ry="12" fill="#7A200A"/>
      <ellipse cx="0" cy="6"  rx="30" ry="10" fill="url(#gGold)"/>
      <path d="M0 -22 C9 -9 7 0 0 0 C-7 0 -9 -9 0 -22 Z" fill="#FFF3C4"/>
    </g>
    <g transform="translate(1720 545)">
      <ellipse cx="0" cy="9" rx="25" ry="10" fill="#7A200A"/>
      <ellipse cx="0" cy="5" rx="25" ry="8"  fill="url(#gGold)"/>
      <path d="M0 -18 C7 -7 6 0 0 0 C-6 0 -7 -7 0 -18 Z" fill="#FFF3C4"/>
    </g>
  </g>

  <!-- Copy -->
  <g font-family="Poppins, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <g transform="translate(140 168)">
      <rect x="0" y="0" width="286" height="46" rx="23" fill="#F5A623"/>
      <text x="143" y="31" text-anchor="middle" font-size="20" font-weight="700"
            fill="#6B1607" letter-spacing="3">FESTIVE OFFERS</text>
    </g>

    <text x="140" y="292" font-size="88" font-weight="800" fill="#FFFFFF">Ganpati Bappa Morya</text>

    <text x="140" y="368" font-size="38" font-weight="600" fill="#FFE7B3">
      Up to 60% off on TVs, ACs, refrigerators &amp; washing machines
    </text>

    <g font-size="26" font-weight="600" fill="#FFFFFF" opacity="0.95">
      <text x="140" y="432">No-cost EMI</text>
      <text x="356" y="432">•</text>
      <text x="386" y="432">Free delivery</text>
      <text x="608" y="432">•</text>
      <text x="638" y="432">Installation included</text>
    </g>

    <g transform="translate(140 470)">
      <rect x="0" y="0" width="252" height="66" rx="33" fill="url(#gGold)"/>
      <text x="126" y="43" text-anchor="middle" font-size="26" font-weight="800"
            fill="#6B1607" letter-spacing="1">SHOP THE SALE</text>
    </g>
  </g>
</svg>
